<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101717;color:#f2f6f0;font-family:Arial,sans-serif}body{background:radial-gradient(ellipse at 72% 65%,#213d333e,transparent 65%),#101717}
header{position:absolute;top:40px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;z-index:5}header b{font-size:24px;letter-spacing:1px}header span{font-size:18px;color:#96a89f}.dot{display:inline-block;width:12px;height:12px;background:#b7f0ce;border-radius:50%;margin-right:12px}
#headline{position:absolute;top:102px;left:80px;margin:0;font-size:56px;letter-spacing:-2px;font-weight:500;z-index:5}#sub{position:absolute;left:83px;top:180px;color:#91aa9c;font-size:22px;z-index:5}
#window{position:absolute;left:0;top:200px;width:1920px;height:770px;opacity:0;transform:translateY(25px);transition:opacity .6s,transform .8s cubic-bezier(.16,1,.3,1)}#window.on{opacity:1;transform:translateY(0)}iframe{width:100%;height:100%;border:0;background:transparent;color-scheme:dark}
#output{position:absolute;left:330px;right:330px;top:490px;padding:40px;border:1px solid #799c8755;border-radius:20px;background:#19251f;opacity:0;transition:opacity .4s}#output.on{opacity:1}#output label{display:block;font-size:18px;letter-spacing:3px;color:#9fbea9;margin-bottom:25px}textarea{display:block;width:100%;border:0;background:transparent;color:#d9f7e5;font:32px/1.7 monospace;resize:none;outline:none}
#tip{position:absolute;bottom:46px;left:80px;font-size:25px;color:#c5e9d3;z-index:5}#count{position:absolute;bottom:48px;right:80px;color:#6e9480;font-size:19px;z-index:5}#progress{position:absolute;left:0;bottom:0;height:3px;background:#9bddb3;width:0;z-index:5}
#cursor{position:absolute;z-index:20;pointer-events:none;width:24px;height:30px;filter:drop-shadow(0 2px 3px #0009);transition:transform .45s cubic-bezier(.4,0,.2,1);left:0;top:0}#pulse{position:absolute;width:44px;height:44px;border:2px solid #bcffdb;border-radius:50%;left:-15px;top:-14px;opacity:0}#pulse.flash{animation:tap .4s ease-out}@keyframes tap{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.25)}}
#end{position:absolute;inset:0;background:#101717f5;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .7s}#end.on{opacity:1}#end h1{font-size:92px;letter-spacing:-4px;font-weight:500;margin:0 0 30px}#end p{font-size:34px;color:#b7f0ce;margin:10px}#end small{font-size:22px;color:#9cae9f;margin-top:24px}
#output{top:340px;background:#19211e}#send{border:0;border-radius:12px;background:#b7f0ce;color:#13251c;padding:13px 27px;font-size:22px;margin-top:20px;float:right;cursor:pointer}#answer{clear:both;padding-top:35px;font-size:31px;line-height:1.7;color:#e4f3ea;min-height:70px}#answer small{font-size:16px;color:#98aa9e;display:block;letter-spacing:2px}.formula{font:44px Georgia,serif;margin-top:24px;color:#b7f0ce}#window{top:190px;pointer-events:none}#window.on{pointer-events:auto}#tip{font-size:22px}
</style></head><body><header><b><i class="dot"></i>MATHPASTER</b><span>Less friction. More mathematics.</span></header><h1 id="headline">Write it. Don’t describe it.</h1><div id="sub">A real-time walkthrough of the editor.</div><div id="output" class="on"><label>AI CHAT · ILLUSTRATIVE CONVERSATION</label><textarea id="result" rows="2" placeholder="Ask about your equation…"></textarea><button id="send">Send ↑</button><div id="answer"></div></div><div id="window"><iframe src="http://127.0.0.1:8092/mathlive/editor.html"></iframe></div><div id="tip">Your ideas, in mathematical form.</div><div id="count">01 — GET STARTED</div><div id="progress"></div><div id="cursor"><svg width="24" height="30" viewBox="0 0 24 30"><path d="M3 2L3 24L9 18L14 27L18 25L13 16L22 16Z" fill="#eefbf4" stroke="#13281e" stroke-width="1.5"/></svg><i id="pulse"></i></div><div id="end"><h1>Make room for the math.</h1><p>Get MathPaster. Free for Chrome.</p><small>mathpaster.com</small></div><script src="http://127.0.0.1:8092/mathlive/lib/mathlive.min.js"></script><script>
const frame=document.querySelector('iframe');
document.querySelector('#send').onclick=async()=>{
 const answer=document.querySelector('#answer');answer.innerHTML='<small>AI · ILLUSTRATIVE RESPONSE</small><p id="response-text"></p>';
 const text='Using the power rule, the antiderivative is x³/3. Evaluating from 0 to 1 gives:';
 for(const letter of text){document.querySelector('#response-text').textContent+=letter;await new Promise(r=>setTimeout(r,20))}
 const formula=document.createElement('div');formula.className='formula';formula.textContent='∫₀¹ x² dx = [x³/3]₀¹ = ⅓';answer.append(formula);
};
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data.mathpaster==='insert'){document.querySelector('#result').value='Evaluate this integral: '+e.data.latex;document.querySelector('#window').classList.remove('on');document.querySelector('#output').classList.add('on')}});
window.show=()=>{document.querySelector('#output').classList.remove('on');document.querySelector('#window').classList.add('on');frame.contentWindow.postMessage({mathpaster:'reset',initialMath:{text:'',mode:'inline'}},'*')};
window.scene=(title,sub,tip,count)=>{document.querySelector('#headline').textContent=title;document.querySelector('#sub').textContent=sub;document.querySelector('#tip').textContent=tip;document.querySelector('#count').textContent=count};
window.move=(x,y)=>document.querySelector('#cursor').style.transform=`translate(${x}px,${y}px)`;
window.tap=()=>{const p=document.querySelector('#pulse');p.classList.remove('flash');void p.offsetWidth;p.classList.add('flash')};
window.begin=()=>{let start=performance.now();function tick(){document.querySelector('#progress').style.width=Math.min(100,(performance.now()-start)/600)+'%';requestAnimationFrame(tick)}tick()};
</script></body></html>
