<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src 'self'; font-src 'self'">
  <title>MathPaster</title>
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <main class="app-shell">
    <header class="desktop-bar">
      <div class="brand-lockup">
        <span class="app-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM17 14v7M13.5 17.5h7"/>
          </svg>
        </span>
        <span class="platform-name">Desktop</span>
      </div>

      <div class="desktop-actions">
        <div class="shortcut-status" id="shortcut-status" title="Global window shortcut">
          <span class="status-dot" id="shortcut-dot"></span>
          <kbd>Alt</kbd><span>+</span><kbd>M</kbd>
        </div>

        <button type="button" class="window-button" id="hide-button" aria-label="Hide MathPaster" title="Hide to tray">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button type="button" class="window-button close" id="close-button" aria-label="Close MathPaster" title="Close to tray">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </header>

    <section class="editor-stage">
      <iframe
        id="editor-frame"
        title="MathPaster equation editor"
        src="editor/editor.html?desktop=true"
      ></iframe>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="desktop.js"></script>
</body>
</html>
